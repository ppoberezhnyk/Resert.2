name: Build IPA from ZIP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          mkdir -p source_code
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} -d source_code \;

      - name: Create App Bundle Structure
        run: |
          mkdir -p Payload/DertetGPT.app

      - name: Compile Swift App
        run: |
          SWIFT_FILES=$(find . -name "*.swift")
          if [ -z "$SWIFT_FILES" ]; then
            echo "Помилка: Не знайдено файлів .swift!"
            exit 1
          fi
          xcrun -sdk iphoneos swiftc $SWIFT_FILES \
            -target arm64-apple-ios17.0 \
            -emit-executable \
            -o Payload/DertetGPT.app/DertetGPT

      - name: Create Info.plist & Package IPA
        run: |
          cat <<EOF > Payload/DertetGPT.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DertetGPT</string>
              <key>CFBundleIdentifier</key>
              <string>com.dertet.gpt</string>
              <key>CFBundleName</key>
              <string>DertetGPT</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
          </dict>
          </plist>
          EOF
          zip -r DertetGPT.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DertetGPT-IPA
          path: DertetGPT.ipa
